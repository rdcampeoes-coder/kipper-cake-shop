services:
  - type: web
    name: kipper-cake-shop
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: kipper-db
          property: connectionString

databases:
  - name: kipper-db
    plan: free
    region: frankfurt

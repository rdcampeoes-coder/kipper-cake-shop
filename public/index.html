<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Kipper App">
  <meta name="description" content="Kipper App — aplicação de gestão desenvolvida pela Starta com o apoio da Kipper.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kipper App">
  <title>Kipper App</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mobile-top-nav.css">
  <link rel="stylesheet" href="/v3.css">
  <link rel="stylesheet" href="/v4-round.css">
  <link rel="stylesheet" href="/v5-round.css">
  <style>
    .brand{justify-content:center}
    .brand-lockup{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;width:100%}
    .brand-lockup img{display:block;width:54px;height:54px;border-radius:14px;object-fit:cover}
    .brand-name{font-weight:800;letter-spacing:.12em;font-size:14px;line-height:1.15;background:linear-gradient(90deg,#1557ff,#10cfe3);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
    .brand-by{margin-top:5px;font-size:9px;letter-spacing:.2em;color:#777168;white-space:nowrap}
    .brand-by strong{color:#1557ff;font-weight:800}
    @media(max-width:1050px) and (min-width:721px){
      .brand-lockup{display:block}.brand-lockup img{margin:auto;width:48px;height:48px}.brand-copy{display:none}
    }
  </style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-lockup" aria-label="Kipper App by Starta">
        <img src="/icons/icon-192.png" alt="Kipper App">
        <div class="brand-copy"><div class="brand-name">KIPPER APP</div><div class="brand-by">by <strong>STARTA</strong></div></div>
      </div>
    </div>
    <nav>
      <button class="nav-btn active" data-view="dashboard">⌂ <span>Início</span></button>
      <button class="nav-btn" data-view="orders">◫ <span>Encomendas</span></button>
      <button class="nav-btn" data-view="clients">♡ <span>Clientes</span></button>
      <button class="nav-btn" data-view="products">▦ <span>Produtos</span></button>
      <button class="nav-btn" data-view="stock">◧ <span>Stock</span></button>
      <button class="nav-btn" data-view="finance">€ <span>Finanças</span></button>
      <button class="nav-btn" data-view="more">⋯ <span>Mais</span></button>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar"><div><h1 id="pageTitle">Início</h1><p id="pageSubtitle">Visão geral do negócio</p></div><div class="top-actions"><span id="dbStatus" class="badge demo">A carregar…</span><button id="quickOrder" class="primary">+ Nova encomenda</button></div></header>
    <section id="view"><div class="card">A carregar…</div></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close>×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-ui.js"></script>
<script src="/demo-data.js"></script>
<script src="/state.js"></script>
<script src="/auth-api-patch.js"></script>
<script src="/views.js"></script>
<script src="/product-demo-recipes.js"></script>
<script src="/forms.js"></script>
<script src="/orders-ui.js"></script>
<script src="/order-save-fix.js"></script>
<script src="/batch-fixes-v2.js"></script>
<script src="/v3-core-stock.js"></script>
<script src="/v3-clients-products.js"></script>
<script src="/v3-orders.js"></script>
<script src="/v4-round.js"></script>
<script src="/v5-round.js"></script>
<script src="/admin-management.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(error => console.warn('PWA service worker:', error));
    });
  }
</script>
</body>
</html>
